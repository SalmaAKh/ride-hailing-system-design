version: "3.9"

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: uber-dynamodb-local
    ports:
      - "8000:8000"
    # -inMemory: fastest for local dev; data resets whenever the container restarts.
    # (We'll just re-run `npm run create-tables` after a restart.)
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: uber-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: "http://dynamodb-local:8000"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "local"
      AWS_SECRET_ACCESS_KEY: "local"
    depends_on:
      - dynamodb-local

  redis:
    image: redis:7
    container_name: uber-redis
    ports:
      - "6381:6379"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: uber-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

volumes:
  redisinsight-data:
